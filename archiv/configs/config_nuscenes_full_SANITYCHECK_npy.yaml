# =============================================================================
# BEV World Model — Konfiguration (Task 13: SANITY-CHECK, Modus A / .npy)
# =============================================================================
#
# Identisch zu config_nuscenes_full_SANITYCHECK.yaml, ABER:
#   - KEIN train_h5_path / val_h5_path gesetzt
#     -> BEVDatasetConfig.h5_path = None -> Modus A: direkter .npy-Zugriff
#        (siehe bev_dataset.py Docstring, Zeile ~10ff)
#   - eigenes Checkpoint-/Output-Verzeichnis (".../task13_SANITYCHECK_npy/")
#
# Zweck: Direkter Geschwindigkeitsvergleich .npy (Modus A) vs. HDF5 (Modus B)
# über dieselben 4 Epochen, gleiche Daten, gleiche Hyperparameter.
#
#   .npy-Modus:  kein Dekompressions-Overhead, ABER 34.149 einzelne
#                Datei-Opens pro Epoche (Filesystem-Overhead)
#   HDF5-Modus:  ein offener Handle, ABER gzip-Dekompression pro Read
#
# NICHT für die echten Ergebnisse verwenden -- reiner Geschwindigkeitstest.
#
# Aufruf:
#   python train_linux.py --config config_nuscenes_full_SANITYCHECK_npy.yaml --phase cell
# =============================================================================


# -----------------------------------------------------------------------------
# Modell-Architektur (unverändert)
# -----------------------------------------------------------------------------
model:
  d_model:    256
  n_frames:   3
  grid_size:  32
  n_heads:    8
  d_ff:       1024
  n_layers:   4
  dropout:    0.1
  phase:      "cell"    # wird durch --phase überschrieben


# -----------------------------------------------------------------------------
# Training (unverändert -- Baseline-Loss, NICHT Teil dieses Tasks)
# -----------------------------------------------------------------------------
training:
  epochs:         4        # SANITY-CHECK: nur 4 Epochen statt 50
  batch_size:     4       # zurück auf 4 (wie im bewährten Setup) -- batch 16 war Verdacht für VRAM-Thrashing bei 3072 Tokens
  lr:             1.0e-4
  weight_decay:   1.0e-4
  patience:       10      # > 4 -> kein Early-Stopping-Eingriff im Check
  seed:           42
  num_workers:    4       # Linux: 4 Worker
  prefetch_factor: 4      # moderates Vorab-Laden
  use_cosine:     true
  lambda_cos:     0.1
  lambda_dist:    0.1
  log_every:      1       # SANITY-CHECK: jede Epoche loggen (statt alle 5)


# -----------------------------------------------------------------------------
# Daten (Task 13 — voller nuScenes trainval-Datensatz, offizieller Split)
# Train: 28.130 Latents (700 Szenen) | Val: 6.019 Latents (150 Szenen)
# Quelle: Task 12 (Seg-Latent-Extraktion, bevfusion-seg.pth)
# -----------------------------------------------------------------------------
data:
  mode: "explicit"

  train_sources:
    - pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_train.pkl"
      latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/train"

  val_sources:
    - pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_val.pkl"
      latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/val"

  # HDF5-Caches (Task 13, Schritt 2 -- build_hdf5_cache.py, je Split eine Datei)
  # Modus A (.npy-Direktzugriff) -- h5_path bewusst NICHT gesetzt:
  # train_h5_path: "/home/vima/Desktop/Masterarbeit/Nuscenes/Cache/bev_latents_train.h5"
  # val_h5_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/Cache/bev_latents_val.h5"


# -----------------------------------------------------------------------------
# Checkpoints (EIGENES Verzeichnis -- überschreibt NICHT die alte
# Val-only-Baseline unter Code_final/checkpoints/phase2/)
# -----------------------------------------------------------------------------
checkpoints:
  dir:        "/home/vima/Desktop/Masterarbeit/Code_final/checkpoints/task13_SANITYCHECK_npy"
  save_every: 1   # SANITY-CHECK: jede Epoche speichern (nur 4 Epochen total)


# -----------------------------------------------------------------------------
# Inference (Task 13, Schritt 6 -- Metriken auf dem neuen, vollen Val-Set)
# Alle Latents aus val_sources werden genutzt — kein weiterer Split.
#
# Für Smoke-Test: max_samples: 5
# Für vollen Run: max_samples: null
# -----------------------------------------------------------------------------
inference:
  # Welche Latents für Inference? (= val_sources, voller Val-Split)
  pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_val.pkl"
  latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/val"

  # Bester Checkpoint aus diesem SANITY-CHECK-Lauf (Modus A / .npy)
  checkpoint_phase2: "/home/vima/Desktop/Masterarbeit/Code_final/checkpoints/task13_SANITYCHECK_npy/best_val_loss.pt"

  # Output: pred_<token>.npy, real_<token>.npy, inference_log.json
  output_dir_phase2: "/home/vima/Desktop/Masterarbeit/Code_final/predictions/task13_SANITYCHECK_npy"

  batch_size:    1
  device:        "auto"
  rollout_steps: 0
  max_samples:   null


# -----------------------------------------------------------------------------
# Weights & Biases
# -----------------------------------------------------------------------------
wandb:
  project: "bev_worldmodel"
  entity:  null
