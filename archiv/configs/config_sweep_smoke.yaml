# =============================================================================
# BEV World Model — SWEEP-BASIS (Task 16a, lokale float16-Variante)
# =============================================================================
# Basis: config_nuscenes_full_fp16.yaml (15.3B.2, fp16-Packs, mIoU-Plateau-
#   Stopping, decode_every=3), ABER:
#   - training-Block auf die 6 EXPLIZITEN Loss-Terme umgestellt (15.1-Schema),
#     damit sweep_runner.py jeden Regler per Zeilen-Regex patchen kann.
#   - lambda_std FIX auf den 15.3-Arbeitspunkt 1.0 (konservativ: std-Ratio
#     0.915, nachweislich mIoU-kostenfrei, kleinste Latent-Stoerung).
#     -> Grundlage fuer die Folge-Sweeps (grad/ssim/mean/cos), je EINE Variable.
#
# VERWENDUNG (nicht direkt starten, sondern ueber den Runner):
#   python sweep_runner.py --regler lambda_grad --values 0 0.05 0.1 0.3 1.0 \
#          --base config_sweep_base_fp16.yaml
# Der Runner patcht pro Wert NUR <regler> + checkpoints.dir (Rest byte-identisch)
# und faehrt Training -> Inference (300 Val) -> optional Full-Val -> CSV.
# =============================================================================


# -----------------------------------------------------------------------------
# Modell-Architektur (unveraendert)
# -----------------------------------------------------------------------------
model:
  d_model:    256
  n_frames:   3
  grid_size:  32
  n_heads:    8
  d_ff:       1024
  n_layers:   4
  dropout:    0.1
  phase:      "cell"    # wird durch --phase ueberschrieben


# -----------------------------------------------------------------------------
# Training — 6-Term-Loss (15.1). lambda_std FIX, ein anderer Term ist je
# Sweep die unabhaengige Variable (vom Runner gepatcht).
# -----------------------------------------------------------------------------
training:
  epochs:         50
  batch_size:     8
  lr:             1.0e-4
  weight_decay:   1.0e-4
  patience:       10
  # --- mIoU-Plateau-Early-Stopping (Task 15.3B.2, ZUSAETZLICH zu Val-Loss) ---
  # Der Zeit-Hebel, der die Sweeps seriell-lokal machbar macht: jeder Lauf
  # killt sich am mIoU-Plateau statt stur 50 Epochen zu fahren.
  miou_early_stop: true
  miou_patience:   3        # "dreimal in Folge kein signifikanter Fortschritt"
  miou_min_delta:  0.014    # 15.2-Rauschboden
  seed:           42
  num_workers:    4
  prefetch_factor: 4
  use_cosine:     true
  log_every:      5
  # --- 6 explizite Loss-Terme (15.1) ---------------------------------------
  # lambda_std FIX auf 15.3-Arbeitspunkt. Die uebrigen 5 sind Baseline (Task 14);
  # der Runner dreht pro Sweep GENAU EINEN davon.
  lambda_mse:     1.0
  lambda_cos:     0.1
  lambda_mean:    0.1
  lambda_std:     1.0     # 15.3-Bestwert (Arbeitspunkt 1.0-3.0; 1.0 konservativ)
  lambda_grad:    0.0     # Default AUS; 16a.2 Sweep-Variable
  lambda_ssim:    0.1


# -----------------------------------------------------------------------------
# Daten (voller nuScenes trainval, offizieller Split) — fp16-Memmap-Packs
# -----------------------------------------------------------------------------
data:
  mode: "explicit"

  train_sources:
    - pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_train.pkl"
      latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/train"

  val_sources:
    - pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_val.pkl"
      latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/val"

  # Memmap-Pack (15.3B), fp16 (15.3B.2). EIN Schalter; idempotentes Packen
  # beim ersten Lauf, danach Skip. Alle Sweeps lesen dieselben fp16-Packs.
  use_packed:   true
  packed_dtype: float16
  train_packed_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents_packed_fp16/seg/train"
  val_packed_dir:   "/home/vima/Desktop/Masterarbeit/Nuscenes/latents_packed_fp16/seg/val"


# -----------------------------------------------------------------------------
# Decode-Validierung (Ebene 1) — steuert best_miou.pt (mIoU-Proxy, 300 Subset)
# -----------------------------------------------------------------------------
decode_validation:
  enabled:        true
  seg_checkpoint: "/home/vima/bevfusion/bevfusion-main/pretrained/bevfusion-seg.pth"
  decode_every:   3        # hoehere zeitliche Aufloesung fuers Plateau-Stopping
  n_subset:       300      # fixe Val-Samples fuer mIoU-Messung


# -----------------------------------------------------------------------------
# Checkpoints — vom Runner pro Sweep-Wert auf ein isoliertes Verzeichnis
# gepatcht (dir -> <sweep-root>/<regler>_<wert>). Wert hier nur Platzhalter.
# -----------------------------------------------------------------------------
checkpoints:
  dir:        "/home/vima/Desktop/Masterarbeit/Code_final/checkpoints/task16a/_base"
  save_every: 10


# -----------------------------------------------------------------------------
# Inference — Runner ruft inference.py mit --checkpoint <best_miou.pt>,
# --output <pred_dir>, --max_samples 300 auf (CLI ueberschreibt die Werte hier).
# -----------------------------------------------------------------------------
inference:
  pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_val.pkl"
  latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/val"
  checkpoint_phase2: "/home/vima/Desktop/Masterarbeit/Code_final/checkpoints/task16a/_base/phase2/best_miou.pt"
  output_dir_phase2: "/home/vima/Desktop/Masterarbeit/Code_final/predictions/task16a/_base"
  batch_size:    1
  device:        "auto"
  rollout_steps: 0
  max_samples:   null


# -----------------------------------------------------------------------------
# Weights & Biases
# -----------------------------------------------------------------------------
wandb:
  project: "bev_worldmodel"
  entity:  null
