# =============================================================================
# BEV World Model — Konfiguration (Task 13: SANITY-CHECK, NICHT die echte Baseline!)
# =============================================================================
#
# Identisch zu config_nuscenes_full.yaml, ABER:
#   - epochs: 4 statt 50 (nur zum Verifizieren, dass alles durchläuft)
#   - eigenes Checkpoint-/Output-Verzeichnis (".../task13_SANITYCHECK/")
#     -> überschreibt NICHT die echten Baseline-Checkpoints
#
# Zweck: Schritt 4 aus dem Task-13-Plan. Prüft:
#   - DataLoader laden korrekt aus beiden neuen HDF5-Caches (train/val)
#   - Keine Token-Mismatches zwischen PKL und Cache
#   - Batch-Shapes stimmen: Input [B,3,256,128,128], Target [B,256,128,128]
#   - Loss sinkt sinnvoll über ein paar Epochen
#   - Checkpointing greift, GPU-Auslastung/Geschwindigkeit ist plausibel
#
# NICHT für die echten Ergebnisse verwenden -- nach erfolgreichem Check diese
# Datei ignorieren/löschen und mit config_nuscenes_full.yaml (epochs: 50)
# den eigentlichen Trainingslauf starten.
#
# Aufruf:
#   python train_linux.py --config config_nuscenes_full_SANITYCHECK.yaml --phase cell
# =============================================================================


# -----------------------------------------------------------------------------
# Modell-Architektur (unverändert)
# -----------------------------------------------------------------------------
model:
  d_model:    256
  n_frames:   3
  grid_size:  32
  n_heads:    8
  d_ff:       1024
  n_layers:   4
  dropout:    0.1
  phase:      "cell"    # wird durch --phase überschrieben


# -----------------------------------------------------------------------------
# Training (unverändert -- Baseline-Loss, NICHT Teil dieses Tasks)
# -----------------------------------------------------------------------------
training:
  epochs:         4        # SANITY-CHECK: nur 4 Epochen statt 50
  batch_size:     8       # Vergleich gegen npy-Lauf (dort bs=4) -- bs=8 testen für mehr Durchsatz
  lr:             1.0e-4
  weight_decay:   1.0e-4
  patience:       10      # > 4 -> kein Early-Stopping-Eingriff im Check
  seed:           42
  num_workers:    4       # Linux: 4 Worker
  prefetch_factor: 4      # moderates Vorab-Laden (gleich wie npy-Lauf für fairen Vergleich)
  use_cosine:     true
  lambda_cos:     0.1
  lambda_dist:    0.1
  log_every:      1       # SANITY-CHECK: jede Epoche loggen (statt alle 5)


# -----------------------------------------------------------------------------
# Daten (Task 13 — voller nuScenes trainval-Datensatz, offizieller Split)
# Train: 28.130 Latents (700 Szenen) | Val: 6.019 Latents (150 Szenen)
# Quelle: Task 12 (Seg-Latent-Extraktion, bevfusion-seg.pth)
# -----------------------------------------------------------------------------
data:
  mode: "explicit"

  train_sources:
    - pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_train.pkl"
      latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/train"

  val_sources:
    - pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_val.pkl"
      latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/val"

  # HDF5-Caches (Task 13, Schritt 2 -- build_hdf5_cache.py, je Split eine Datei)
  train_h5_path: "/home/vima/Desktop/Masterarbeit/Nuscenes/Cache/bev_latents_train.h5"
  val_h5_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/Cache/bev_latents_val.h5"


# -----------------------------------------------------------------------------
# Checkpoints (EIGENES Verzeichnis -- überschreibt NICHT die alte
# Val-only-Baseline unter Code_final/checkpoints/phase2/)
# -----------------------------------------------------------------------------
checkpoints:
  dir:        "/home/vima/Desktop/Masterarbeit/Code_final/checkpoints/task13_SANITYCHECK"
  save_every: 1   # SANITY-CHECK: jede Epoche speichern (nur 4 Epochen total)


# -----------------------------------------------------------------------------
# Inference (Task 13, Schritt 6 -- Metriken auf dem neuen, vollen Val-Set)
# Alle Latents aus val_sources werden genutzt — kein weiterer Split.
#
# Für Smoke-Test: max_samples: 5
# Für vollen Run: max_samples: null
# -----------------------------------------------------------------------------
inference:
  # Welche Latents für Inference? (= val_sources, voller Val-Split)
  pkl_path:   "/home/vima/Desktop/Masterarbeit/Nuscenes/complete/nuscenes_infos_val.pkl"
  latent_dir: "/home/vima/Desktop/Masterarbeit/Nuscenes/latents/seg/val"

  # Bester Checkpoint aus diesem SANITY-CHECK-Lauf
  checkpoint_phase2: "/home/vima/Desktop/Masterarbeit/Code_final/checkpoints/task13_SANITYCHECK/best_val_loss.pt"

  # Output: pred_<token>.npy, real_<token>.npy, inference_log.json
  output_dir_phase2: "/home/vima/Desktop/Masterarbeit/Code_final/predictions/task13_SANITYCHECK"

  batch_size:    1
  device:        "auto"
  rollout_steps: 0
  max_samples:   null


# -----------------------------------------------------------------------------
# Weights & Biases
# -----------------------------------------------------------------------------
wandb:
  project: "bev_worldmodel"
  entity:  null
