# =============================================================================
# BEV World Model — Konfiguration (Task 13: Baseline auf VOLLEM Datensatz)
# + Task 15.3B.1: Memmap-Packing (packed_dir)
# CLUSTER-VARIANTE, JOB B -- reiner TIMING-VERGLEICH (use_packed: false).
# NICHT fuer den mIoU-Korrektheits-Check gedacht (der .npy-Pfad ist schon aus
# Task 13/14 verifiziert) -- nur um data_time_ratio/Epochenzeit direkt gegen
# Job A (config_nuscenes_full_cluster.yaml, use_packed:true) zu stellen, auf
# identischer Hardware/identischem Filesystem. Bewusst kurz (epochs: 8) --
# data_time_ratio pendelt sich schon nach 2-3 Epochen ein, volle Konvergenz
# nicht noetig. Siehe ZWISCHENBERICHT_CLUSTER_INFRASTRUKTUR.md Abschnitt 6
# fuer den urspruenglichen Befund (22-35% GPU-Auslastung im .npy-Modus).
# =============================================================================
#
# Unterschied zu config_nuscenes_val.yaml:
#   - data.mode: "explicit" statt "split"
#     (offizieller nuScenes train/val-Split aus Task 12, kein interner
#     70/15/15-Split mehr auf einer einzelnen Val-only-PKL)
#   - train_sources / val_sources statt sources
#   - .npy-Direktzugriff (KEIN h5_path) -- Sanity-Check zeigte: npy ~2x
#     schneller als HDF5+gzip (804s vs 1656s pro Epoche), da keine
#     Dekompression pro Latent-Read noetig. HDF5-Caches existieren zwar,
#     werden aber bewusst NICHT genutzt.
#   - eigenes Checkpoint-Verzeichnis (überschreibt NICHT die alte Baseline)
#
# NEU (Task 15.3B.1): optionales packed_dir pro Split. Gesetzt -> Laufzeit
#   liest per Memmap (ein zusammenhaengendes packed.npy) statt tausender
#   .npy-Einzel-Opens. Weggelassen -> exakt heutiges .npy-Verhalten (Fallback).
#   Erzeugung: python -u pack_latents.py --config <diese datei> --split val
#              python -u pack_latents.py --config <diese datei> --split train
#
# Loss- und Modell-Hyperparameter bewusst UNVERÄNDERT gegenüber der alten
# Val-only-Baseline -- das ist der ganze Sinn von Task 13: nur die
# Datenmenge ändert sich, nicht die Loss. Nur SO ist der Vergleich
# "alte Baseline vs. neue Baseline" sauber (siehe TASK13_ABSCHLUSSBERICHT.md).
#
# Training:   python train_linux.py --config config_nuscenes_full.yaml --phase cell
# Inference:  python inference.py   --config config_nuscenes_full.yaml --phase cell
# Smoke-Test: python inference.py   --config config_nuscenes_full.yaml --phase cell --max_samples 5
# =============================================================================


# -----------------------------------------------------------------------------
# Modell-Architektur (unverändert)
# -----------------------------------------------------------------------------
model:
  d_model:    256
  n_frames:   3
  grid_size:  32
  n_heads:    8
  d_ff:       1024
  n_layers:   4
  dropout:    0.1
  phase:      "cell"    # wird durch --phase überschrieben


# -----------------------------------------------------------------------------
# Training (unverändert -- Baseline-Loss, NICHT Teil dieses Tasks)
# -----------------------------------------------------------------------------
training:
  epochs:         8        # Job B: nur fuer Timing-Vergleich, keine Konvergenz noetig
  batch_size:     8
  lr:             1.0e-4
  weight_decay:   1.0e-4
  patience:       8        # >= epochs -> kein Early-Stop-Rauschen in der kurzen Messung
  seed:           42
  num_workers:    4        # konsistent mit Job A (Fairness) -- nach OOM-Nachtrag gesenkt
  prefetch_factor: 2       # NACHTRAG nach OOM (Job 122730): von 4 auf 2 gesenkt
  use_cosine:     true
  lambda_cos:     0.1
  lambda_dist:    0.1
  lambda_ssim:    0.1
  log_every:      5


# -----------------------------------------------------------------------------
# Daten (Task 13 — voller nuScenes trainval-Datensatz, offizieller Split)
# Train: 28.130 Latents (364 erkannte Szenen, 27038 Sequenzen) |
# Val:   6.019 Latents (92 erkannte Szenen, 5743 Sequenzen)
# Quelle: von Thorsten auf BeeGFS vorbereitet (siehe ZWISCHENBERICHT_CLUSTER_
# INFRASTRUKTUR.md Abschnitt 3). Verifiziert: 34149 .npy insgesamt =
# 28130 (train) + 6019 (val), stimmt exakt mit lokalen Zahlen ueberein.
# -----------------------------------------------------------------------------
data:
  mode: "explicit"

  train_sources:
    - pkl_path:   "/home/vima/pkl/nuscenes_infos_train.pkl"
      latent_dir: "/mnt/beegfs/ssd/lrt81-students/lrt81-vima/latents/seg/train"

  val_sources:
    - pkl_path:   "/home/vima/pkl/nuscenes_infos_val.pkl"
      latent_dir: "/mnt/beegfs/ssd/lrt81-students/lrt81-vima/latents/seg/val"

  # ---------------------------------------------------------------------------
  # Memmap-Pack (Task 15.3B.1) -- integrierter, abschaltbarer Teil des
  # train-Zyklus. EIN Schalter steuert alles:
  #   use_packed: true  -> train_linux.py packt fehlende Splits beim Start selbst
  #                        (idempotent, Skip wenn vorhanden) und liest aus Memmap
  #   use_packed: false -> reines .npy direkt ueber BeeGFS (Netzwerk) -- das war
  #                        die urspruengliche Konfiguration mit 22-35% GPU-Aus-
  #                        lastung (siehe Zwischenbericht Abschnitt 6). Nur fuer
  #                        den direkten Timing-Vergleich (Job B) auf false setzen.
  # NEUES Verzeichnis latents_packed/ liegt als Geschwister von latents/ direkt
  # unter ~/beegfs (vima:tas-students, drwxrwxrwx) -- kein Schreibzugriff auf
  # latents/ selbst noetig (gehoert thlu), nur Lesezugriff (vorhanden).
  use_packed:   false      # Job B: reines .npy ueber BeeGFS -- der Vergleichspunkt
  packed_dtype: float32

  train_packed_dir: "/mnt/beegfs/ssd/lrt81-students/lrt81-vima/latents_packed/train"
  val_packed_dir:   "/mnt/beegfs/ssd/lrt81-students/lrt81-vima/latents_packed/val"
  # ---------------------------------------------------------------------------

  # HDF5-Modus bewusst NICHT konfiguriert -- war schon lokal ~2x langsamer als
  # .npy (Task 13 Sanity-Check), auf BeeGFS mit Netzwerk-Overhead erst recht
  # keine sinnvolle Option.

# -----------------------------------------------------------------------------
# Decode-Validierung (Task 14, Ebene 1) — NEU
# Fehlt dieser Block oder ist enabled: false, laeuft nur Val-Loss (wie Task 13).
# -----------------------------------------------------------------------------
decode_validation:
  enabled:        true
  seg_checkpoint: "/home/vima/bevfusion-seg.pth"
  decode_every:   5        # alle N Epochen decodieren (Epoche 0 immer zusaetzlich)
  n_subset:       300      # Anzahl fixer Val-Samples fuer mIoU-Messung


# -----------------------------------------------------------------------------
# Checkpoints — best_val_loss.pt (wie bisher) + best_miou.pt (neu, Task 14)
# HINWEIS 15.3B.1: Fuer den Anker-Lauf ggf. eigenes Verzeichnis setzen,
# damit die Task-14-Checkpoints nicht ueberschrieben werden, z.B.
#   dir: ".../checkpoints/task15_3B1_anchor"
# -----------------------------------------------------------------------------
checkpoints:
  dir:        "/home/vima/Code_final/checkpoints/task15_3B1_timing_compare"
  save_every: 10


# -----------------------------------------------------------------------------
# Inference (Task 13, Schritt 6 -- Metriken auf dem neuen, vollen Val-Set)
# Alle Latents aus val_sources werden genutzt — kein weiterer Split.
#
# Für Smoke-Test: max_samples: 5
# Für vollen Run: max_samples: null
# -----------------------------------------------------------------------------
inference:
  # Welche Latents für Inference? (= val_sources, voller Val-Split)
  pkl_path:   "/home/vima/pkl/nuscenes_infos_val.pkl"
  latent_dir: "/mnt/beegfs/ssd/lrt81-students/lrt81-vima/latents/seg/val"

  # Bester Checkpoint aus DIESEM Anker-Lauf (Task 15.3B.1) -- nach Abschluss
  # auf best_miou.pt setzen, sobald der Anker-Lauf durchgelaufen ist
  checkpoint_phase2: "/home/vima/Code_final/checkpoints/task15_3B1_anchor/phase2/best_miou.pt"

  # Output: pred_<token>.npy, real_<token>.npy, inference_log.json
  output_dir_phase2: "/home/vima/Code_final/predictions/task15_3B1_anchor"

  batch_size:    1
  device:        "auto"
  rollout_steps: 0
  max_samples:   null


# -----------------------------------------------------------------------------
# Weights & Biases
# HINWEIS: auf dem Cluster ist wandb installiert (anders als lokal, wo es
# fehlte und der Lauf klaglos ohne Logging weiterlief). Nicht-interaktive
# Kontexte (| tee) unterdruecken den wandb-Login-Prompt -> vor dem Start:
#   export WANDB_MODE=offline
# (siehe ZWISCHENBERICHT_CLUSTER_INFRASTRUKTUR.md Abschnitt 5, Punkt 8)
# -----------------------------------------------------------------------------
wandb:
  project: "bev_worldmodel"
  entity:  null
