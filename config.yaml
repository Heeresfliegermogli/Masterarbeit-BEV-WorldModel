# =============================================================================
# BEV World Model — Konfiguration
# =============================================================================
# Training:   python train.py     --config config.yaml --phase frame
# Inference:  python inference.py --config config.yaml --phase frame
# Smoke-Test: python inference.py --config config.yaml --phase frame --max_samples 5
# =============================================================================


# -----------------------------------------------------------------------------
# Modell-Architektur
# -----------------------------------------------------------------------------
model:
  d_model:    256
  n_frames:   3
  grid_size:  32
  n_heads:    8
  d_ff:       1024
  n_layers:   4
  dropout:    0.1
  phase:      "frame"   # wird durch --phase überschrieben


# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  epochs:       50
  batch_size:   16
  lr:           1.0e-4
  weight_decay: 1.0e-4
  patience:     10
  seed:         42
  num_workers:  4
  use_cosine:   true
  lambda_cos:   0.1
  lambda_dist:  0.1
  log_every:    5


# -----------------------------------------------------------------------------
# Daten (nur für Training relevant)
# -----------------------------------------------------------------------------
data:
  mode: "split"
  sources:
    - pkl_path:   "C:/Users/vince/Documents/World Model/nuscenes/Latents/nuscenes_infos_train.pkl"
      latent_dir: "C:/Users/vince/Documents/World Model/nuscenes/Latents/Train"
  train_ratio: 0.70
  val_ratio:   0.15


# -----------------------------------------------------------------------------
# Checkpoints
# -----------------------------------------------------------------------------
checkpoints:
  dir:        "C:/Users/vince/Documents/World Model/Code_final/checkpoints"
  save_every: 10


# -----------------------------------------------------------------------------
# Inference
# Hier werden ALLE Latents aus pkl_path/latent_dir genutzt — kein Split.
# Einfach den Ordner mit den fertigen Latents angeben und loslaufen.
#
#   pkl_path:   PKL-Datei mit Frame-Metadaten (Timestamps, Tokens)
#   latent_dir: Ordner mit den bev_latent_<token>.npy Dateien
#
# Für Smoke-Test: max_samples auf z.B. 5 setzen
# Für vollen Run:  max_samples auf null lassen
# -----------------------------------------------------------------------------
inference:
  # Welche Latents für Inference nutzen?
  pkl_path:   "C:/Users/vince/Documents/World Model/nuscenes/Latents/nuscenes_infos_val.pkl"
  latent_dir: "C:/Users/vince/Documents/World Model/nuscenes/Latents/Val"

  # Checkpoint-Pfade pro Phase (automatisch nach --phase gewählt)
  checkpoint_phase1: "C:/Users/vince/Documents/World Model/Code_final/checkpoints/phase1/best_val_loss.pt"
  checkpoint_phase2: "C:/Users/vince/Documents/World Model/Code_final/checkpoints/phase2/best_val_loss.pt"

  # Output: hier landen pred_<token>.npy, real_<token>.npy, inference_log.json
  output_dir_phase1: "C:/Users/vince/Documents/World Model/Code_final/predictions/phase1"
  output_dir_phase2: "C:/Users/vince/Documents/World Model/Code_final/predictions/phase2"

  batch_size:    1
  device:        "auto"
  rollout_steps: 0
  max_samples:   null


# -----------------------------------------------------------------------------
# Weights & Biases
# -----------------------------------------------------------------------------
wandb:
  project: "bev_worldmodel"
  entity:  null
