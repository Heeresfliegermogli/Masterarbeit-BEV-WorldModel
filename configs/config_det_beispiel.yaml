# =============================================================================
# >>> BESTER BETRIEBSPUNKT DET: Smooth-L1 + std + energy(4) + cos(0,1), mAP 0,3752 <<<
# Beispiel-Trainingskonfiguration — Detektionsstrang
# =============================================================================
# Weltmodell auf den Detektions-Latents (256 x 180 x 180, TransFusion-Strang).
# Architektur identisch zum Seg-Strang; nur das Token-Gitter ist groesser
# (180/4 = 45 -> 2025 Tokens/Frame) und die Latents werden per latent_scale
# auf die Seg-Skala normalisiert.
#
# Loss: der beste gemessene Betriebspunkt (nach Abgabe systematisch
# bestimmt, Mittel aus zwei Seeds): Smooth-L1 + Streuungsterm +
# Energie-Gewichtung (energy_alpha) + cos -> mAP 0,3752 auf der
# Vollvalidierung. Zum Vergleich: 6-Term-Konfiguration der Thesis
# 0,3438 (mse-Rueckgrat, cos/mean/ssim je 0,1), Minimal-Konfiguration
# 0,3264. Begruendung der Terme: siehe README, Abschnitt Zielfunktion.
#
# Die Pfade unter data/, checkpoints/ und pretrained/ sind an die eigene
# Umgebung anzupassen (siehe README, Abschnitt "Daten & Gewichte").
# Bewertet wird der Det-Strang nicht ueber die Decode-Validierung, sondern
# ueber das Injektionsprotokoll: Vorhersagen auf Roh-Skala zurueckrechnen
# (Faktor 1/0,3641) und per bevfusion_patch/ (LOAD_BEV_LATENTS) durch den
# eingefrorenen TransFusion-Kopf auswerten.
#
# Aufruf: python -u train_linux.py --config configs/config_det_beispiel.yaml
# =============================================================================


# -----------------------------------------------------------------------------
# Modell-Architektur (identisch zum Seg-Strang bis auf das Gitter)
# -----------------------------------------------------------------------------
model:
  d_model:    256
  n_frames:   3
  grid_size:  45        # Det-Gitter: 180/4 (Seg: 128/4 = 32)
  n_heads:    8
  d_ff:       1024
  n_layers:   4
  dropout:    0.1
  phase:      "cell"


# -----------------------------------------------------------------------------
# Training — bester Betriebspunkt: Smooth-L1 (Struktur) + std (Streuungs-
# Waechter) + Energie-Gewichtung (starke Objektzellen) + cos (Kanal-
# Richtung). Jeder Term laesst sich mit lambda_i = 0 / alpha = 0
# deaktivieren.
# -----------------------------------------------------------------------------
training:
  epochs:         50
  batch_size:     8
  lr:             1.0e-4
  weight_decay:   1.0e-4
  patience:       10
  # Det nutzt kein mIoU-Plateau-Stopping (keine Decode-Validierung im
  # Training); gestoppt wird ueber die Val-Loss-Patience.
  miou_early_stop: false
  seed:           42
  num_workers:    4
  prefetch_factor: 4
  use_cosine:     true
  log_every:      5
  # Loss-Gewichte (bester Betriebspunkt, mAP 0,3752)
  lambda_mse:     1.0     # Gewicht des Rekonstruktionsterms (TERM 1)
  lambda_cos:     0.1     # Richtungs-Term: staerkster Einzelhebel des Det-Strangs
  lambda_mean:    0.0
  lambda_std:     1.0     # Streuungs-Waechter (Verteilungs-Kalibrierung)
  lambda_grad:    0.0
  lambda_ssim:    0.0     # schadet in beiden Straengen signifikant
  # Energie-Gewichtung: Zellgewicht w = 1 + alpha*E_real/mean(E_real)
  # auf dem Rekonstruktionsterm — wertet die wenigen starken
  # Objektzellen auf (Fussgaenger-Befund)
  energy_alpha:   4.0
  # Distanzmass des Rekonstruktionsterms (mse | l1 | smooth_l1)
  recon_loss:     smooth_l1
  # Thesis-Stand als Alternative: recon_loss mse, cos/mean/ssim je 0.1,
  # energy_alpha 0 -> mAP 0,3438


# -----------------------------------------------------------------------------
# Daten (nuScenes trainval, offizieller Split) — fp16-Memmap-Packs.
# latent_scale normalisiert die Det-Latents auf die Seg-Skala
# (gemessene Kanalstreuung Det/Seg ~ 2,75) — haelt die Smooth-L1-/std-
# Arbeitspunkte beider Straenge vergleichbar. Die Auswertekette rechnet
# mit 1/0,3641 zurueck.
# -----------------------------------------------------------------------------
data:
  mode: "explicit"

  train_sources:
    - pkl_path:   "data/nuscenes/nuscenes_infos_train.pkl"
      latent_dir: "data/latents/det/train"

  val_sources:
    - pkl_path:   "data/nuscenes/nuscenes_infos_val.pkl"
      latent_dir: "data/latents/det/val"

  use_packed:   true
  packed_dtype: float16
  latent_scale: 0.3641
  train_packed_dir: "data/latents_packed_fp16/det/train"
  val_packed_dir:   "data/latents_packed_fp16/det/val"


# -----------------------------------------------------------------------------
# Decode-Validierung — fuer den Det-Strang deaktiviert (der Seg-Decoder
# passt nicht auf das 45er-Gitter; Bewertung siehe Kopfkommentar).
# -----------------------------------------------------------------------------
decode_validation:
  enabled:        false
  seg_checkpoint: "pretrained/bevfusion-seg.pth"
  decode_every:   3
  n_subset:       300


# -----------------------------------------------------------------------------
# Checkpoints
# -----------------------------------------------------------------------------
checkpoints:
  dir:        "checkpoints/det_basis"
  save_every: 10


# -----------------------------------------------------------------------------
# Inference — Achtung: inference.py ist auf den Seg-Strang ausgelegt
# (32er-Gitter). Fuer Det die Vorhersagen ueber das Injektionsprotokoll
# auswerten (bevfusion_patch/, LOAD_BEV_LATENTS).
# -----------------------------------------------------------------------------
inference:
  pkl_path:   "data/nuscenes/nuscenes_infos_val.pkl"
  latent_dir: "data/latents/det/val"
  checkpoint_phase2: "checkpoints/det_basis/phase2/best_val_loss.pt"
  output_dir_phase2: "predictions/det_basis"
  batch_size:    1
  device:        "auto"
  rollout_steps: 0
  max_samples:   null


# -----------------------------------------------------------------------------
# Weights & Biases (optional)
# -----------------------------------------------------------------------------
wandb:
  project: "bev_worldmodel"
  entity:  null
