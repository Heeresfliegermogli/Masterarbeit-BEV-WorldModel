# =============================================================================
# Beispiel-Trainingskonfiguration — Segmentierungsstrang (Minimal-Setup)
# =============================================================================
# Entspricht der in der Thesis verwendeten Basis: 6,05-M-Prädiktor,
# fp16-Memmap-Packs, mIoU-Plateau-Early-Stopping. Die Pfade unter data/,
# checkpoints/ und pretrained/ sind an die eigene Umgebung anzupassen
# (siehe README, Abschnitt "Daten & Gewichte").
#
# Aufruf: python -u train_linux.py --config examples/config_seg_beispiel.yaml
# =============================================================================


# -----------------------------------------------------------------------------
# Modell-Architektur
# -----------------------------------------------------------------------------
model:
  d_model:    256
  n_frames:   3
  grid_size:  32
  n_heads:    8
  d_ff:       1024
  n_layers:   4
  dropout:    0.1
  phase:      "cell"


# -----------------------------------------------------------------------------
# Training — 6 explizite Loss-Terme. Die Minimal-Konfiguration der Thesis
# verwendet Smooth-L1 + Streuungsterm (lambda_std); die uebrigen Terme
# lassen sich mit lambda_i = 0 vollstaendig deaktivieren.
# -----------------------------------------------------------------------------
training:
  epochs:         50
  batch_size:     8
  lr:             1.0e-4
  weight_decay:   1.0e-4
  patience:       10
  # mIoU-Plateau-Early-Stopping: bricht ab, wenn dreimal in Folge kein
  # Fortschritt oberhalb der Seed-Variabilitaet (0.014 mIoU) erreicht wird.
  miou_early_stop: true
  miou_patience:   3
  miou_min_delta:  0.014
  seed:           42
  num_workers:    4
  prefetch_factor: 4
  use_cosine:     true
  log_every:      5
  # Loss-Gewichte — Minimal-Konfiguration der Thesis (mIoU 0,6946 auf der
  # Vollvalidierung, Proxy-Skala): nur Rekonstruktion + Streuungsterm.
  # Die 6-Term-Baseline (cos/mean/ssim je 0,1, recon_loss mse) liegt
  # gleichauf (0,6920).
  lambda_mse:     1.0     # Gewicht des Rekonstruktionsterms (TERM 1)
  lambda_cos:     0.0
  lambda_mean:    0.0
  lambda_std:     1.0
  lambda_grad:    0.0
  lambda_ssim:    0.0
  # Distanzmass des Rekonstruktionsterms (mse | l1 | smooth_l1)
  recon_loss:     smooth_l1


# -----------------------------------------------------------------------------
# Daten (nuScenes trainval, offizieller Split) — fp16-Memmap-Packs
# -----------------------------------------------------------------------------
data:
  mode: "explicit"

  train_sources:
    - pkl_path:   "data/nuscenes/nuscenes_infos_train.pkl"
      latent_dir: "data/latents/seg/train"

  val_sources:
    - pkl_path:   "data/nuscenes/nuscenes_infos_val.pkl"
      latent_dir: "data/latents/seg/val"

  # Memmap-Pack + fp16: idempotentes Packen beim ersten Lauf, danach Skip.
  use_packed:   true
  packed_dtype: float16
  train_packed_dir: "data/latents_packed_fp16/seg/train"
  val_packed_dir:   "data/latents_packed_fp16/seg/val"


# -----------------------------------------------------------------------------
# Decode-Validierung — steuert best_miou.pt (Proxy-Skala,
# Teilstichprobe mit 300 Fenstern)
# -----------------------------------------------------------------------------
decode_validation:
  enabled:        true
  seg_checkpoint: "pretrained/bevfusion-seg.pth"
  decode_every:   3
  n_subset:       300


# -----------------------------------------------------------------------------
# Checkpoints
# -----------------------------------------------------------------------------
checkpoints:
  dir:        "checkpoints/seg_basis"
  save_every: 10


# -----------------------------------------------------------------------------
# Inference (inference.py; CLI-Argumente ueberschreiben die Werte hier)
# -----------------------------------------------------------------------------
inference:
  pkl_path:   "data/nuscenes/nuscenes_infos_val.pkl"
  latent_dir: "data/latents/seg/val"
  checkpoint_phase2: "checkpoints/seg_basis/phase2/best_miou.pt"
  output_dir_phase2: "predictions/seg_basis"
  batch_size:    1
  device:        "auto"
  rollout_steps: 0
  max_samples:   null


# -----------------------------------------------------------------------------
# Weights & Biases (optional)
# -----------------------------------------------------------------------------
wandb:
  project: "bev_worldmodel"
  entity:  null
